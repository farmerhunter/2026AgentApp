# P0 candidate: review actual production/test vhost bindings before installation.
# Public roots must contain reviewed demo build assets only, never runtime data.

location ^~ /api/xuetuzhiban {
    access_log off;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 503 '{"error":"p0_protected_disabled"}';
}

location ^~ /apps/xuetuzhiban/app {
    access_log off;
    default_type text/html;
    add_header Cache-Control "no-store" always;
    return 503 '<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>真实功能已暂停</title><h1>真实功能已暂停</h1><p>上传、识别、分析、已有结果查看和打印暂时不可用，原数据保留。</p><a href="/apps/xuetuzhiban/demo/">查看公开演示</a></html>';
}

location ^~ /api/xuetuzhiban-test {
    access_log off;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 503 '{"error":"p0_protected_disabled"}';
}

location ^~ /apps/xuetuzhiban-test/app {
    access_log off;
    default_type text/html;
    add_header Cache-Control "no-store" always;
    return 503 '<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>真实功能已暂停</title><h1>真实功能已暂停</h1><p>上传、识别、分析、已有结果查看和打印暂时不可用，原数据保留。</p><a href="/apps/xuetuzhiban-test/demo/">查看公开演示</a></html>';
}

location = /apps/xuetuzhiban/ {
    return 302 /apps/xuetuzhiban/demo/;
}

location /apps/xuetuzhiban/ {
    alias /opt/hermes/2026agentapp-prod/web/dist/;
    try_files $uri $uri/ /apps/xuetuzhiban/index.html;
}

location /apps/xuetuzhiban/data/ {
    alias /opt/hermes/2026agentapp-prod/web/dist/data/;
    try_files $uri =404;
}
