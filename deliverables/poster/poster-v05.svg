<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
  width="900mm" height="1200mm" viewBox="0 0 900 1200">
  <defs>
    <style><![CDATA[
      text { font-family: "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; }
      .navy { fill: #0E2B4A; }
      .ink { fill: #173B57; }
      .muted { fill: #5F7487; }
      .teal { fill: #0A9F98; }
      .purple { fill: #5A4BC2; }
      .coral { fill: #F46F52; }
      .gold { fill: #E8B73E; }
      .panel { fill: #FFFFFF; stroke: #C9D9DF; stroke-width: 1.4; }
      .section { font-size: 16px; font-weight: 800; fill: #173B57; }
      .subhead { font-size: 9px; font-weight: 800; fill: #173B57; }
      .body { font-size: 7.6px; font-weight: 500; fill: #294E68; }
      .small { font-size: 6.6px; font-weight: 500; fill: #5F7487; }
      .micro { font-size: 5.5px; font-weight: 500; fill: #5F7487; }
      .white { fill: #FFFFFF; }
      .bold { font-weight: 800; }
    ]]></style>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#FFFFFF" opacity="0.11"/>
    </pattern>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#0A9F98"/>
    </marker>
    <clipPath id="shot1"><rect x="50" y="626" width="244" height="137" rx="5"/></clipPath>
    <clipPath id="shot2"><rect x="328" y="626" width="244" height="137" rx="5"/></clipPath>
    <clipPath id="shot3"><rect x="606" y="626" width="244" height="137" rx="5"/></clipPath>
    <clipPath id="paperA"><rect x="54" y="726" width="34" height="51" rx="2"/></clipPath>
    <clipPath id="paperB"><rect x="82" y="722" width="34" height="51" rx="2"/></clipPath>
  </defs>

  <rect width="900" height="1200" fill="#EEF4F5"/>

  <rect width="900" height="105" class="navy"/>
  <rect width="900" height="105" fill="url(#dots)"/>
  <circle cx="50" cy="38" r="19" class="teal"/>
  <path d="M41 39 l7 7 l13 -17" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="80" y="27" font-size="9.5" font-weight="700" fill="#87DBD5">AI 智能体应用 · 我的学习生活小助手</text>
  <text x="35" y="78" font-size="40" font-weight="800" fill="#FFFFFF" letter-spacing="2">学途智伴</text>
  <text x="301" y="37" font-size="17" font-weight="800" fill="#FFFFFF">从一道错题，到一周学习建议</text>
  <text x="301" y="63" font-size="11" font-weight="700" fill="#FFFFFF">比较多次作答，形成学习记忆，再把问题变成下一步行动</text>
  <text x="301" y="85" font-size="8.3" fill="#BFD5E4">它不是替我学习，而是帮我把问题看清楚。</text>
  <rect x="745" y="15" width="121" height="75" rx="6" fill="#F46F52"/>
  <text x="805.5" y="33" font-size="6.8" font-weight="700" fill="#FFE1D9" text-anchor="middle">参展学生</text>
  <text x="805.5" y="53" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">刘晓京</text>
  <line x1="759" y1="61" x2="852" y2="61" stroke="#FFAD9A" stroke-width="1"/>
  <text x="805.5" y="78" font-size="6.8" font-weight="700" fill="#FFFFFF" text-anchor="middle">人大附中朝阳学校</text>

  <rect x="34" y="118" width="245" height="140" rx="7" class="panel"/>
  <rect x="34" y="118" width="8" height="140" rx="4" class="coral"/>
  <text x="57" y="144" class="section">我为什么需要它</text>
  <text x="57" y="168" class="body">进入初中后，试卷、错题和学习备注越来越多。</text>
  <text x="57" y="186" class="body">我花了不少时间练习，却还是很难看清：</text>
  <text x="57" y="209" font-size="10" font-weight="800" fill="#173B57">为什么同类问题又出现？</text>
  <text x="57" y="227" font-size="10" font-weight="800" fill="#173B57">哪些地方真的在进步？</text>
  <rect x="55" y="237" width="207" height="13" rx="3" fill="#FFF0EC"/>
  <text x="158.5" y="246" font-size="5.8" font-weight="800" fill="#C85038" text-anchor="middle">让 AI 比较多次作答，关键判断由我确认。</text>

  <rect x="290" y="118" width="576" height="140" rx="7" class="panel"/>
  <rect x="290" y="118" width="8" height="140" rx="4" class="teal"/>
  <text x="314" y="144" class="section">学途智伴能做什么</text>
  <text x="314" y="164" class="small">把散落在试卷里的信息，变成可以继续比较、复查和行动的学习线索。</text>
  <g>
    <rect x="311" y="177" width="75" height="45" rx="5" fill="#E7F6F4"/>
    <text x="348.5" y="193" class="subhead" fill="#087D78" text-anchor="middle">上传材料</text>
    <text x="348.5" y="209" class="small" text-anchor="middle">试卷或作业</text>
    <text x="391" y="205" font-size="13" font-weight="800" fill="#0A9F98">→</text>
    <rect x="407" y="177" width="75" height="45" rx="5" fill="#E7F6F4"/>
    <text x="444.5" y="193" class="subhead" fill="#087D78" text-anchor="middle">OCR 切题</text>
    <text x="444.5" y="209" class="small" text-anchor="middle">识别题目文字</text>
    <text x="487" y="205" font-size="13" font-weight="800" fill="#0A9F98">→</text>
    <rect x="503" y="177" width="75" height="45" rx="5" fill="#FFF0EC"/>
    <text x="540.5" y="193" class="subhead" fill="#C85038" text-anchor="middle">我确认错题</text>
    <text x="540.5" y="209" class="small" text-anchor="middle">选择分析对象</text>
    <text x="583" y="205" font-size="13" font-weight="800" fill="#0A9F98">→</text>
    <rect x="599" y="177" width="75" height="45" rx="5" fill="#EFEDFB"/>
    <text x="636.5" y="193" class="subhead" fill="#4E3DB0" text-anchor="middle">AI 找原因</text>
    <text x="636.5" y="209" class="small" text-anchor="middle">分析具体作答</text>
    <text x="679" y="205" font-size="13" font-weight="800" fill="#0A9F98">→</text>
    <rect x="695" y="177" width="75" height="45" rx="5" fill="#FFF0EC"/>
    <text x="732.5" y="193" class="subhead" fill="#C85038" text-anchor="middle">我确认记忆</text>
    <text x="732.5" y="209" class="small" text-anchor="middle">决定保留什么</text>
    <text x="775" y="205" font-size="13" font-weight="800" fill="#0A9F98">→</text>
    <rect x="791" y="177" width="58" height="45" rx="5" fill="#FFF7D9"/>
    <text x="820" y="193" class="subhead" fill="#A77606" text-anchor="middle">行动建议</text>
    <text x="820" y="209" class="small" text-anchor="middle">生成周报</text>
  </g>
  <text x="314" y="242" class="body bold">它不只记录“哪道题错了”，还会发现重复、看见变化，并保留未知。</text>

  <rect x="34" y="270" width="832" height="251" rx="7" class="panel"/>
  <text x="50" y="295" class="section">系统全景图</text>
  <text x="50" y="311" class="small">从图片输入、AI 分析到学习记忆与周报输出</text>
  <image x="45" y="316" width="485" height="194" preserveAspectRatio="xMidYMid meet"
    xlink:href="assets/learning-system-architecture-v3-poster.png"
    href="assets/learning-system-architecture-v3-poster.png"/>
  <rect x="540" y="282" width="314" height="227" rx="7" fill="#F0EEFB"/>
  <text x="558" y="307" class="section" fill="#4E3DB0">AI 智能体在其中做了什么？</text>
  <g>
    <circle cx="568" cy="335" r="9" class="teal"/><text x="568" y="339" font-size="7" font-weight="800" fill="#FFFFFF" text-anchor="middle">读</text>
    <text x="585" y="333" class="subhead">读懂</text><text x="619" y="333" class="body">题目、答案和解题过程</text>
    <circle cx="568" cy="369" r="9" class="purple"/><text x="568" y="373" font-size="7" font-weight="800" fill="#FFFFFF" text-anchor="middle">析</text>
    <text x="585" y="367" class="subhead">分析</text><text x="619" y="367" class="body">说明这一次具体错在哪里</text>
    <circle cx="568" cy="403" r="9" class="coral"/><text x="568" y="407" font-size="7" font-weight="800" fill="#FFFFFF" text-anchor="middle">记</text>
    <text x="585" y="401" class="subhead">记住</text><text x="619" y="401" class="body">提出记忆，由我确认是否保留</text>
    <circle cx="568" cy="437" r="9" class="teal"/><text x="568" y="441" font-size="7" font-weight="800" fill="#FFFFFF" text-anchor="middle">比</text>
    <text x="585" y="435" class="subhead">比较</text><text x="619" y="435" class="body">把新练习和学习记忆联系起来</text>
    <circle cx="568" cy="471" r="9" class="gold"/><text x="568" y="475" font-size="7" font-weight="800" fill="#0E2B4A" text-anchor="middle">行</text>
    <text x="585" y="469" class="subhead">行动</text><text x="619" y="469" class="body">汇总成周报和下一步建议</text>
  </g>
  <rect x="557" y="484" width="280" height="17" rx="4" fill="#FFFFFF"/>
  <text x="697" y="495" font-size="6.2" font-weight="800" fill="#4E3DB0" text-anchor="middle">AI 整理、比较和建议；我确认什么重要、什么值得记住。</text>

  <rect x="34" y="533" width="832" height="442" rx="7" class="panel"/>
  <text x="50" y="560" class="section">从一道错题，到可以执行的学习建议</text>
  <text x="850" y="559" class="small" text-anchor="end">真实功能界面与原创模拟练习</text>

  <g>
    <rect x="50" y="575" width="244" height="38" rx="5" fill="#E7F6F4"/>
    <circle cx="68" cy="594" r="11" class="teal"/><text x="68" y="598" font-size="9" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="87" y="590" class="subhead" fill="#087D78">错题进入系统</text>
    <text x="87" y="604" class="small">OCR 找到题目，我确认分析对象</text>

    <rect x="328" y="575" width="244" height="38" rx="5" fill="#EFEDFB"/>
    <circle cx="346" cy="594" r="11" class="purple"/><text x="346" y="598" font-size="9" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="365" y="590" class="subhead" fill="#4E3DB0">AI 发现问题，我确认记忆</text>
    <text x="365" y="604" class="small">从具体作答形成 finding 和记忆候选</text>

    <rect x="606" y="575" width="244" height="38" rx="5" fill="#FFF7D9"/>
    <circle cx="624" cy="594" r="11" class="gold"/><text x="624" y="598" font-size="9" font-weight="800" fill="#0E2B4A" text-anchor="middle">3</text>
    <text x="643" y="590" class="subhead" fill="#A77606">比较多次练习，形成行动</text>
    <text x="643" y="604" class="small">把重复、变化和未知整理成周报</text>
  </g>

  <rect x="50" y="626" width="244" height="137" rx="5" fill="#FFFFFF" stroke="#A9C9D0" stroke-width="1.3"/>
  <image x="50" y="626" width="244" height="137" preserveAspectRatio="xMidYMid slice" clip-path="url(#shot1)"
    xlink:href="assets/screenshots/01-import-confirmation-poster.png" href="assets/screenshots/01-import-confirmation-poster.png"/>
  <rect x="169" y="648" width="113" height="103" rx="3" fill="none" stroke="#F46F52" stroke-width="3"/>
  <rect x="174" y="634" width="102" height="17" rx="4" fill="#F46F52"/>
  <text x="225" y="646" font-size="6.6" font-weight="800" fill="#FFFFFF" text-anchor="middle">OCR 切题与作答证据</text>
  <image x="54" y="726" width="34" height="51" preserveAspectRatio="xMidYMid slice" clip-path="url(#paperA)"
    xlink:href="assets/worksheet-a-v1.png" href="assets/worksheet-a-v1.png"/>
  <image x="82" y="722" width="34" height="51" preserveAspectRatio="xMidYMid slice" clip-path="url(#paperB)"
    xlink:href="assets/worksheet-b-v1.png" href="assets/worksheet-b-v1.png"/>
  <rect x="54" y="742" width="62" height="18" rx="4" fill="#0E2B4A" opacity="0.94"/>
  <text x="85" y="754" font-size="6.2" font-weight="800" fill="#FFFFFF" text-anchor="middle">原创 A / B 练习</text>

  <rect x="328" y="626" width="244" height="137" rx="5" fill="#FFFFFF" stroke="#BFB6E9" stroke-width="1.3"/>
  <image x="328" y="626" width="244" height="137" preserveAspectRatio="xMidYMid slice" clip-path="url(#shot2)"
    xlink:href="assets/screenshots/02-analysis-memory-poster.png" href="assets/screenshots/02-analysis-memory-poster.png"/>
  <rect x="408" y="632" width="157" height="66" rx="3" fill="none" stroke="#5A4BC2" stroke-width="3"/>
  <rect x="413" y="635" width="79" height="17" rx="4" fill="#5A4BC2"/>
  <text x="452.5" y="647" font-size="6.5" font-weight="800" fill="#FFFFFF" text-anchor="middle">AI 说明具体错因</text>
  <rect x="408" y="735" width="157" height="22" rx="3" fill="none" stroke="#F46F52" stroke-width="3"/>
  <rect x="467" y="719" width="98" height="17" rx="4" fill="#F46F52"/>
  <text x="516" y="731" font-size="6.5" font-weight="800" fill="#FFFFFF" text-anchor="middle">由我接受或拒绝记忆</text>

  <rect x="606" y="626" width="244" height="137" rx="5" fill="#FFFFFF" stroke="#DEC267" stroke-width="1.3"/>
  <image x="606" y="626" width="244" height="137" preserveAspectRatio="xMidYMid slice" clip-path="url(#shot3)"
    xlink:href="assets/screenshots/03-weekly-report-poster.png" href="assets/screenshots/03-weekly-report-poster.png"/>
  <rect x="686" y="644" width="156" height="109" rx="3" fill="none" stroke="#E8B73E" stroke-width="3"/>
  <rect x="714" y="631" width="128" height="17" rx="4" fill="#D39B13"/>
  <text x="778" y="643" font-size="6.5" font-weight="800" fill="#FFFFFF" text-anchor="middle">跨练习比较并生成周报</text>

  <line x1="294" y1="694" x2="323" y2="694" stroke="#0A9F98" stroke-width="2.5" marker-end="url(#arrowTeal)"/>
  <line x1="572" y1="694" x2="601" y2="694" stroke="#0A9F98" stroke-width="2.5" marker-end="url(#arrowTeal)"/>

  <rect x="50" y="779" width="244" height="64" rx="6" fill="#F7FBFB"/>
  <text x="63" y="797" class="subhead" fill="#087D78">纸面练习 → 可分析的学习证据</text>
  <text x="63" y="815" class="body">试卷、OCR 结果和我的确认一起进入系统，</text>
  <text x="63" y="831" class="body">保留“题目是什么、我是怎样作答的”。</text>

  <rect x="328" y="779" width="244" height="64" rx="6" fill="#F5F2FC"/>
  <text x="341" y="797" class="subhead" fill="#4E3DB0">错误答案 → 可以继续比较的记忆</text>
  <text x="341" y="815" class="body">A06、B06 都把根号内数字直接相加；</text>
  <text x="341" y="831" class="body">AI 发现同类问题，但长期记忆由我确认。</text>

  <rect x="606" y="779" width="244" height="64" rx="6" fill="#FFF9E5"/>
  <text x="619" y="797" class="subhead" fill="#A77606">重复问题 → 可以马上执行的下一步</text>
  <text x="619" y="815" class="body bold">先化成最简根式，再合并同类根式；</text>
  <text x="619" y="831" class="body">重新完成 A06、B06。</text>

  <rect x="50" y="858" width="386" height="66" rx="6" fill="#F2F0FC"/>
  <circle cx="72" cy="881" r="11" class="purple"/>
  <text x="72" y="885" font-size="9" font-weight="800" fill="#FFFFFF" text-anchor="middle">↗</text>
  <text x="92" y="879" class="subhead" fill="#4E3DB0">它还会看见变化</text>
  <text x="92" y="898" class="body">A10 没有求出 b；B10 已求出 b＝3，却出现新的计算错误。</text>
  <text x="92" y="914" class="small">系统既看见补上的步骤，也保留新问题。</text>

  <rect x="448" y="858" width="402" height="66" rx="6" fill="#EEF1F5"/>
  <circle cx="470" cy="881" r="11" fill="#667A8C"/>
  <text x="470" y="885" font-size="9" font-weight="800" fill="#FFFFFF" text-anchor="middle">?</text>
  <text x="490" y="879" class="subhead">它也会承认不知道</text>
  <text x="490" y="898" class="body">B09 只有最终答案，没有解题过程，因此保留“原因未知”。</text>
  <text x="490" y="914" class="small">证据不足时不猜测具体错因。</text>

  <rect x="50" y="937" width="800" height="24" rx="5" fill="#EAF2F4"/>
  <text x="450" y="952" font-size="6.5" font-weight="700" fill="#426277" text-anchor="middle">原创模拟练习 A/B 卷 · 最终 Web UI · 已验收结果回放｜用于验证工作方式，不代表成绩提升或大规模准确率</text>

  <rect x="34" y="987" width="535" height="140" rx="7" class="panel"/>
  <rect x="34" y="987" width="8" height="140" rx="4" class="purple"/>
  <text x="56" y="1012" class="section">我和 AI 怎样把它做出来</text>
  <g>
    <rect x="55" y="1027" width="88" height="37" rx="5" fill="#E7F6F4"/>
    <text x="99" y="1042" font-size="6.8" font-weight="800" fill="#087D78" text-anchor="middle">我分析问题</text>
    <text x="99" y="1055" class="micro" text-anchor="middle">说清要求</text>
    <text x="147" y="1050" font-size="12" font-weight="800" fill="#0A9F98">→</text>
    <rect x="161" y="1027" width="88" height="37" rx="5" fill="#EFEDFB"/>
    <text x="205" y="1042" font-size="6.8" font-weight="800" fill="#4E3DB0" text-anchor="middle">AI 和我讨论</text>
    <text x="205" y="1055" class="micro" text-anchor="middle">帮我设计</text>
    <text x="253" y="1050" font-size="12" font-weight="800" fill="#0A9F98">→</text>
    <rect x="267" y="1027" width="88" height="37" rx="5" fill="#EFEDFB"/>
    <text x="311" y="1042" font-size="6.8" font-weight="800" fill="#4E3DB0" text-anchor="middle">AI 帮助实现</text>
    <text x="311" y="1055" class="micro" text-anchor="middle">和测试</text>
    <text x="359" y="1050" font-size="12" font-weight="800" fill="#0A9F98">→</text>
    <rect x="373" y="1027" width="79" height="37" rx="5" fill="#FFF0EC"/>
    <text x="412.5" y="1042" font-size="6.8" font-weight="800" fill="#C85038" text-anchor="middle">我运行检查</text>
    <text x="412.5" y="1055" class="micro" text-anchor="middle">发现问题</text>
    <text x="456" y="1050" font-size="12" font-weight="800" fill="#0A9F98">→</text>
    <rect x="470" y="1027" width="80" height="37" rx="5" fill="#FFF7D9"/>
    <text x="510" y="1042" font-size="6.6" font-weight="800" fill="#A77606" text-anchor="middle">修改和下一版</text>
    <text x="510" y="1055" class="micro" text-anchor="middle">增强</text>
  </g>
  <text x="56" y="1086" font-size="7.8" font-weight="700" fill="#4E3DB0">遇到不懂的知识，正好可以先问 AI，让它讲明白，让我做到会用。</text>
  <text x="56" y="1105" class="small">与 AI 协作开发，也是我学习新知识、不断改进作品的过程。</text>

  <rect x="580" y="987" width="286" height="140" rx="7" class="panel"/>
  <rect x="580" y="987" width="8" height="140" rx="4" class="gold"/>
  <text x="602" y="1012" class="section">我的收获和下一步计划</text>
  <text x="602" y="1036" class="body">我学会了先分析问题、把大任务拆小，也知道</text>
  <text x="602" y="1053" class="body">AI 的结果不能直接照搬，最后仍要由我判断。</text>
  <text x="602" y="1076" class="subhead" fill="#A77606">下一步</text>
  <text x="602" y="1094" class="small">继续补强用户管理、多学科知识图谱等功能；</text>
  <text x="602" y="1109" class="small">把它真的用起来，用自己的学习验证它的价值。</text>

  <rect x="0" y="1139" width="900" height="61" class="navy"/>
  <text x="35" y="1163" font-size="11" font-weight="800" fill="#FFFFFF">“不只是记录错题，而是把一次次作答变成可以继续行动的学习线索。”</text>
  <text x="35" y="1183" font-size="6.3" fill="#BCD2E2">原创模拟练习只验证工作方式；OCR 和 AI 仍可能出错。</text>
  <rect x="700" y="1150" width="166" height="36" rx="6" fill="#FFFFFF"/>
  <text x="783" y="1164" font-size="6.4" font-weight="700" fill="#5F7487" text-anchor="middle">访问作品</text>
  <text x="783" y="1178" font-size="10" font-weight="800" fill="#0A9F98" text-anchor="middle">jingyun.bj.cn</text>
